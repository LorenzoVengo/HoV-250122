<!DOCTYPE html>
<html>
  <head>
    <title>HOUSE of VENGO | Calculator</title>
    <meta name="description" content="Welcome to HOUSE of VENGO." />
    <meta charset="utf-8" />
    <meta name="robots" content="index,follow" />
    <link
      rel="icon"
      href="images/HOUSE of VENGO favicon_300x300 LV 2 shape.svg"
    />
    <link rel="stylesheet" href="calculatorstyle.css" />

    <script src="calculatorscript.js" defer></script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <!--THE NECK-->
  <body>
    <div class="divone"><h1>Stream Time Stamp Calculator</h1></div>
    <div class="divtwo">
      <div class="title"><h2>Lap</h2></div>
      <div class="title"><h2>Sum</h2></div>
      <div class="title"><h2>Premiere</h2></div>
      <div class="chart1">
        <div class="inputdiv" id="inputdiv1">
          <label for="lap1">Lap 1</label>
          <input class="inputBox" type="text" id="lap1" autocomplete="off" />
        </div>
        <div class="inputdiv" id="inputdiv2">
          <label for="lap2">Lap 2</label>
          <input class="inputBox" type="text" id="lap2" autocomplete="off" />
        </div>
        <div class="inputdiv" id="inputdiv3">
          <label for="lap3">Lap 3</label>
          <input class="inputBox" type="text" id="lap3" autocomplete="off" />
        </div>
        <div class="inputdiv" id="inputdiv4">
          <label for="lap4">Lap 4</label>
          <input class="inputBox" type="text" id="lap4" autocomplete="off" />
        </div>
        <div class="inputdiv" id="inputdiv5">
          <label for="lap5">Lap 5</label>
          <input class="inputBox" type="text" id="lap5" autocomplete="off" />
        </div>
      </div>
      <div class="chart2">
        <div class="sum" id="sum1"></div>
        <div class="sum" id="sum2"></div>
        <div class="sum" id="sum3"></div>
        <div class="sum" id="sum4"></div>
        <div class="sum" id="sum5"></div>
      </div>
      <div class="chart3">
        <div class="premiere" id="premiere1"></div>
        <div class="premiere" id="premiere2"></div>
        <div class="premiere" id="premiere3"></div>
        <div class="premiere" id="premiere4"></div>
        <div class="premiere" id="premiere5"></div>
      </div>
      <div class="buttondiv">
        <button class="done" id="done">done</button>
        <button class="clear" id="clear">clear</button>
      </div>
    </div>
  </body>
</html>
